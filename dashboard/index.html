<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Claudex — AI subscription usage</title>
    <meta
      name="description"
      content="Claudex shows your Claude, ChatGPT and Codex session and weekly usage caps in one place."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1115'/%3E%3Crect x='6' y='13' width='20' height='6' rx='3' fill='%23e0653a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Claudex</h1>
      </div>
      <div class="topbar-actions">
        <span id="freshness" class="freshness" aria-live="polite"></span>
        <button id="refresh" class="btn" type="button">Refresh</button>
        <button id="settings-toggle" class="btn btn-quiet" type="button" aria-expanded="false">Account</button>
      </div>
    </header>

    <section id="settings" class="settings" hidden>
      <div class="settings-grid">
        <label>
          <span>API base URL</span>
          <input id="api-url" type="url" spellcheck="false" placeholder="https://api-claudex.zerops.app" />
        </label>
        <label>
          <span>Account ID</span>
          <input id="account-id" type="text" spellcheck="false" placeholder="paste the accountId from the app" />
        </label>
        <label>
          <span>Pairing code (from the phone)</span>
          <input id="pair-code" type="text" spellcheck="false" placeholder="ABCD-EFGH" />
        </label>
      </div>
      <div class="settings-actions">
        <button id="save-settings" class="btn" type="button">Save</button>
        <button id="redeem-code" class="btn btn-quiet" type="button">Redeem code</button>
        <a id="export-csv" class="btn btn-quiet" href="#" download>Export CSV</a>
      </div>
      <p id="settings-note" class="note"></p>
    </section>

    <main id="cards" class="cards" aria-live="polite"></main>

    <section id="trend-section" class="trend" hidden>
      <h2>Last 7 days</h2>
      <div id="trends" class="trend-grid"></div>
    </section>

    <footer class="footer">
      <span id="health" class="health">checking service…</span>
      <span class="footer-sep">·</span>
      <a href="https://github.com/JaneshKapoor/claudex">source</a>
    </footer>

    <script src="./app.js" type="module"></script>
  </body>
</html>
