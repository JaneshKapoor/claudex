# Local development only. Production runs on Zerops managed services — see docs/DEPLOY.md.
#
#   docker compose up -d
#   cd server && cp .env.example .env && npm ci && npm run build && npm run start:api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claudex
      POSTGRES_PASSWORD: claudex
      POSTGRES_DB: claudex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudex"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - claudex_pg:/var/lib/postgresql/data

  cache:
    image: eqalpha/keydb:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  claudex_pg:
