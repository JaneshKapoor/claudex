# Claudex — Zerops build & run definition.
#
# Three setups off one repository:
#   api       – Fastify HTTP service (public, subdomain-enabled)
#   worker    – background usage poller, same build artifact, different entrypoint
#   dashboard – static web dashboard served by nginx
#
# The api and worker setups share an identical build so the poller can never drift
# out of sync with the code that serves the numbers.

zerops:
  # ---------------------------------------------------------------- API
  - setup: api
    build:
      base: nodejs@22
      prepareCommands:
        - npm install -g npm@latest
      buildCommands:
        - cd server && npm ci
        - cd server && npm run build
        # Drop dev dependencies from the artifact after compiling.
        - cd server && npm prune --omit=dev
      deployFiles:
        - server/dist
        - server/node_modules
        - server/package.json
        - server/migrations
        - dashboard
      cache:
        - server/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      # NOTE: this block REPLACES the service's env variables on every deploy, so
      # the cross-service references must live here rather than only in the import
      # YAML. (CLAUDEX_ENCRYPTION_KEY is an envSecret and is not touched by this.)
      envVariables:
        NODE_ENV: production
        PORT: 3000
        HOST: 0.0.0.0
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_BUCKET: ${storage_bucketName}
        S3_ACCESS_KEY_ID: ${storage_accessKeyId}
        S3_SECRET_ACCESS_KEY: ${storage_secretAccessKey}
        CACHE_TTL_SECONDS: "1800"
      healthCheck:
        httpGet:
          port: 3000
          path: /health
      start: node server/dist/api.js

  # ------------------------------------------------------------- WORKER
  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - cd server && npm ci
        - cd server && npm run build
        - cd server && npm prune --omit=dev
      deployFiles:
        - server/dist
        - server/node_modules
        - server/package.json
        - server/migrations
      cache:
        - server/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: false
      envVariables:
        NODE_ENV: production
        PORT: 3000
        HOST: 0.0.0.0
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_BUCKET: ${storage_bucketName}
        S3_ACCESS_KEY_ID: ${storage_accessKeyId}
        S3_SECRET_ACCESS_KEY: ${storage_secretAccessKey}
        # 25 minutes — enough resolution for a 5-hour window without hammering.
        POLL_INTERVAL_MS: "1500000"
      healthCheck:
        httpGet:
          port: 3000
          path: /health
      start: node server/dist/worker.js

  # ---------------------------------------------------------- DASHBOARD
  - setup: dashboard
    build:
      base: nodejs@22
      buildCommands:
        - echo "static dashboard — no build step, that is the point"
      deployFiles:
        - dashboard/~
    run:
      base: nginx@1.22
      ports:
        - port: 80
          httpSupport: true
      documentRoot: dashboard
      healthCheck:
        httpGet:
          port: 80
          path: /index.html
